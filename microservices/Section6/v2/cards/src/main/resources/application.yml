server:
  port: 9000

spring:
  application:
    name: "cards"
  profiles:
    active: prod
  datasource:
    url: jdbc:h2:mem:bankdb
    username: sa
    password: ' '
  h2:
    console:
      enabled: true
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
      database-platform: org.hibernate.dialect.H2Dialect
    auditing:
      enabled: true
  config:
    import: "optional:configserver:http://localhost:8071"
  rabbitmq:
    host: "localhost"
    port: 5672
    username: "guest"
    password: "guest"


management:
  metrics:
    enable:
      system: false
  endpoints:
    web:
      exposure:
        include: "*"
