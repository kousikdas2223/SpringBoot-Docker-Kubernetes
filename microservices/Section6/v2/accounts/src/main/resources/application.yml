server:
  port: 8080

spring:
  application:
    name: "accounts"
  profiles:
    active: prod
  datasource:
    url: jdbc:h2:mem:bankdb
    username: sa
    password: ' '
  h2:
    console:
      enabled: true
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
      database-platform: org.hibernate.dialect.H2Dialect
    auditing:
      enabled: true
  config:
    import: "configserver:http://localhost:8071"


management:
  metrics:
    enable:
      system: false


