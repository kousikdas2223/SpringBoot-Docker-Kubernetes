server:
  port: 8090

spring:
  application:
    name: "loans"
  profiles:
    active: prod
  datasource:
    url: jdbc:mysql://localhost:3310/loansdb
    username: root
    password: root
  sql:
    init:
      mode: always
  jpa:
    show-sql: true
  config:
    import: "optional:configserver:http://localhost:8071"

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    enableRedirects: false
    service-url:
      defaultZone: http://localhost:8070/eureka

management:
  metrics:
    enable:
      system: false
  endpoints:
    web:
      exposure:
        include: "*"
    health:
      readiness-state:
        enabled: true
      liveness-state:
        enabled: true
  endpoint:
    shutdown:
      enabled: true
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

endpoints:
  shutdown:
    enabled: true

info:
  app:
    version: "1.0.0"
    name: "cards"
    description: "MyBank Cards Service"

logging:
  level:
    com:
      springboottutorial:
        loans: DEBUG