server:
  port: 9000

spring:
  application:
    name: "cards"
  profiles:
    active: prod
  datasource:
    url: jdbc:mysql://localhost:3309/cardsdb
    username: root
    password: root
  sql:
    init:
      mode: always
  jpa:
    show-sql: true
  config:
    import: "optional:configserver:http://localhost:8071"

management:
  metrics:
    enable:
      system: false
  endpoints:
    web:
      exposure:
        include: "*"
