#      file: common-config.yml
    accounts_db:
      container_name: accountsdb
      ports:
        - 3308:3306
      environment:
        MYSQL_DATABASE: accountsdb
      extends:
        file: common-config.yml
        service: microservice-db-config

    cards_db:
      container_name: cardsdb
      ports:
        - 3309:3306
      environment:
        MYSQL_DATABASE: cardsdb
      extends:
        file: common-config.yml
        service: microservice-db-config

    loans_db:
      container_name: loansdb
      ports:
        - 3310:3306
      environment:
        MYSQL_DATABASE: loansdb
      extends:
        file: common-config.yml
        service: microservice-db-config

    configserver:
      image: "daskous/springboot-api:s11-configserver"
      container_name: configserver-ms
      ports:
        - "8071:8071"
      healthcheck:
        test: ["CMD", "curl", "--fail", "http://localhost:8071/actuator/health/readiness"]
        interval: 10s
        timeout: 5s
        retries: 4
        start_period: 30s
      extends:
        file: common-config.yml
        service: microservice-base-config

    eureka-server:
      image: "daskous/springboot-api:s11-eurekaserver"
      container_name: eurekaserver-ms
      ports:
        - "8070:8070"
      depends_on:
        configserver:
          condition: service_healthy
      healthcheck:
        test: ["CMD", "curl", "--fail", "http://eureka-server:8070/actuator/health/readiness"]
        interval: 10s
        timeout: 5s
        retries: 10
        start_period: 10s
      extends:
        file: common-config.yml
        service: microservice-configserver-config
      environment:
        SPRING_APPLICATION_NAME: "eureka-server"

    accounts:
      image: "daskous/springboot-api:s11-accounts"
      container_name: accounts-ms
      ports:
        - "8080:8080"
      depends_on:
        eureka-server:
          condition: service_healthy
        accounts_db:
          condition: service_healthy
      healthcheck:
        test: ["CMD", "curl", "--fail", "http://localhost:8080/actuator/health/readiness"]
        interval: 10s
        timeout: 5s
        retries: 4
        start_period: 30s
      environment:
        SPRING_APPLICATION_NAME: "accounts"
        SPRING_DATASOURCE_URL: "jdbc:mysql://accounts_db/accountsdb"
      extends:
        file: common-config.yml
        service: microservice-eurekaserver-config

    cards:
      image: "daskous/springboot-api:s11-cards"
      container_name: cards-ms
      ports:
        - "9000:9000"
      depends_on:
        eureka-server:
          condition: service_healthy
        cards_db:
          condition: service_healthy
      healthcheck:
        test: ["CMD", "curl", "--fail", "http://localhost:9000/actuator/health/readiness"]
        interval: 10s
        timeout: 5s
        retries: 4
        start_period: 30s
      environment:
        SPRING_APPLICATION_NAME: "cards"
        SPRING_DATASOURCE_URL: "jdbc:mysql://cards_db/cardsdb"
      extends:
        file: common-config.yml
        service: microservice-eurekaserver-config

    loans:
      image: "daskous/springboot-api:s11-loans"
      container_name: loans-ms
      ports:
        - "8090:8090"
      depends_on:
        eureka-server:
          condition: service_healthy
        loans_db:
          condition: service_healthy
      healthcheck:
        test: ["CMD", "curl", "--fail", "http://localhost:8090/actuator/health/readiness"]
        interval: 10s
        timeout: 5s
        retries: 4
        start_period: 30s
      environment:
        SPRING_APPLICATION_NAME: "loans"
        SPRING_DATASOURCE_URL: "jdbc:mysql://loans_db/loansdb"
      extends:
        file: common-config.yml
        service: microservice-eurekaserver-config

    gatewayserver:
      image: "daskous/springboot-api:s11-gatewayserver"
      container_name: gatewayserver-ms
      ports:
        - "8073:8073"
      depends_on:
        accounts:
          condition: service_healthy
        cards:
          condition: service_healthy
        loans:
          condition: service_healthy
  #      redis:
  #        condition: service_healthy
      environment:
        SPRING_APPLICATION_NAME: "gatewayserver"
  #      SPRING_DATA_REDIS_CONNECTION-TIMEOUT: 2s
  #      SPRING_DATA_REDIS_HOST: "redis"
  #      SPRING_DATA_REDIS_PORT: "6379"
  #      SPRING_DATA_REDIS_TIMEOUT: 1s
      extends:
        file: common-config.yml
        service: microservice-eurekaserver-config

networks:
  banknetwork:
    driver: "bridge"