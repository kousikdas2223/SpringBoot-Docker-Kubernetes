spring:
  application:
    name: "eureka-server"
  config:
    import: "optional:configserver:http://localhost:8071/"

management:
  metrics:
    tags:
      enabled: true
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    db:
      enabled: true
    diskSpace:
      enabled: true
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com:
      springboottutorial:
        eurekaserver: DEBUG
  pattern:
    level: "%5p[${spring.application.name},%X{trace_id},%X{span_id}]"

