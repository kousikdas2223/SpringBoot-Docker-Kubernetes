server:
  port: 9000

spring:
  application:
    name: "cards"
  profiles:
    active: prod
  datasource:
    url: jdbc:mysql://localhost:3309/cardsdb
    username: root
    password: root
  sql:
    init:
      mode: always
  jpa:
    show-sql: true
  config:
    import: "optional:configserver:http://localhost:8071"

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8070/eureka

management:
  metrics:
    enable:
      system: false
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      enabled: true
  info:
    env:
      enabled: true

endpoints:
  shutdown:
    enabled: true

info:
  app:
    version: "1.0.0"
    name: "cards"
    description: "MyBank Cards Service"
