spring:
    application:
        name: eureka-server
    config:
      import: "optional:configserver:http://localhost:8071"
management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    db:
      enabled: true
    diskSpace:
      enabled: true
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
server:
  port: 8070

eureka:
  server:
    defaultZone: http://localhost:8070/eureka/