server:
  port: 8080

spring:
  application:
    name: "accounts"
  profiles:
    active: prod
  datasource:
    url: jdbc:mysql://localhost:3308/accountsdb
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
  jpa:
    show-sql: true
  config:
    import: "optional:configserver:http://localhost:8071"

management:
  metrics:
    enable:
      system: false
  endpoints:
    web:
      exposure:
        include: "*"


